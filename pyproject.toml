[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steadycrawl"
version = "0.1.0"
description = "A polite, robots-aware Python crawler with retries, rate limits, and structured extraction."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "TechNinxa contributors"}]
keywords = ["web-scraping", "crawler", "robots-txt", "rate-limiting", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.scripts]
steadycrawl = "steadycrawl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["steadycrawl*"]
